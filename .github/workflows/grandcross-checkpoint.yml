name: GrandCross Local - Validar e arquivar checkpoint

on:
  push:
    paths:
      - 'checkpoints/PASSO_*.json'
  workflow_dispatch:
    inputs:
      step:
        description: 'Numero do passo (multiplo de 10)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Encontrar e validar checkpoints
        id: check
        env:
          CHECKPOINT_STEP: ${{ github.event.inputs.step }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoint-export
          if [[ -n "$CHECKPOINT_STEP" ]]; then
            python3 scripts/validate_checkpoint.py --dir checkpoints --out checkpoint-export --step "$CHECKPOINT_STEP"
          else
            # Publicacoes via API podem reescrever a arvore de varios manifestos.
            # Validar o checkpoint numericamente mais recente; no modo manual, escolher --step.
            latest=0
            for manifest in checkpoints/PASSO_*.json; do
              number="${manifest##*/PASSO_}"
              number="${number%.json}"
              if [[ "$number" =~ ^[0-9]+$ ]] && (( 10#$number > latest )) && (( 10#$number % 10 == 0 )); then
                latest=$((10#$number))
              fi
            done
            if (( latest == 0 )); then
              echo 'Nenhum checkpoint numerico valido encontrado.' >&2
              exit 1
            fi
            echo "Validando checkpoint mais recente: $latest"
            python3 scripts/validate_checkpoint.py --dir checkpoints --out checkpoint-export --step "$latest"
          fi
      - name: Arquivar pacote de evidencias
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grandcross-checkpoints-${{ github.run_number }}
          path: checkpoint-export/
          if-no-files-found: error
          retention-days: 90
