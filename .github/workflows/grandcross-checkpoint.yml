name: GrandCross Local - Validar e arquivar checkpoint

on:
  push:
    paths:
      - 'checkpoints/PASSO_*.json'
  workflow_dispatch:
    inputs:
      step:
        description: 'Numero do passo (multiplo de 10)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Encontrar e validar checkpoints
        id: check
        env:
          CHECKPOINT_STEP: ${{ github.event.inputs.step }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoint-export
          if [[ -n "$CHECKPOINT_STEP" ]]; then
            python3 scripts/validate_checkpoint.py --dir checkpoints --out checkpoint-export --step "$CHECKPOINT_STEP"
          else
            found=0
            while IFS= read -r changed; do
              case "$changed" in
                checkpoints/PASSO_*.json)
                  number="${changed##*/PASSO_}"
                  number="${number%.json}"
                  python3 scripts/validate_checkpoint.py --dir checkpoints --out checkpoint-export --step "$number"
                  found=1
                  ;;
              esac
            done < <(git show --format= --name-only HEAD)
            if [[ "$found" -eq 0 ]]; then
              echo 'Nenhum manifesto encontrado no commit atual.' >&2
              exit 1
            fi
          fi
      - name: Arquivar pacote de evidencias
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grandcross-checkpoints-${{ github.run_number }}
          path: checkpoint-export/
          if-no-files-found: error
          retention-days: 90
